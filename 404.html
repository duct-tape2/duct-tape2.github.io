<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Duct Tape</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5a6475;
      --line: #d9dee8;
      --accent: #075fcc;
      --surface: #ffffff;
      --canvas: #f7f8fa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(42rem, 100%);
      padding: clamp(1.5rem, 4vw, 2.5rem);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 44px rgb(23 32 51 / 8%);
    }
    p { margin: 0 0 1rem; color: var(--muted); line-height: 1.65; }
    .code { color: var(--accent); font-weight: 800; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.1; letter-spacing: 0; }
    nav { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    a {
      color: var(--accent);
      font-weight: 700;
      text-underline-offset: 0.2em;
    }
    .primary {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0.65rem 1rem;
      color: #ffffff;
      background: var(--accent);
      border-radius: 6px;
      text-decoration: none;
    }
    .secondary { display: inline-flex; align-items: center; min-height: 2.75rem; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page moved or never existed.</h1>
    <p>Use the current $99 Repo Launch page, inspect the public work, or review the engineering profile before opening an inquiry.</p>
    <nav aria-label="Useful destinations">
      <a class="primary" href="https://duct-tape2.github.io/repo-launch/">Open Repo Launch</a>
      <a class="secondary" href="https://duct-tape2.github.io/work/">Public work</a>
      <a class="secondary" href="https://duct-tape2.github.io/examples/storefront-starter-case-study/">Case study</a>
      <a class="secondary" href="https://duct-tape2.github.io/PUBLIC_ENGINEERING_PROFILE.md">Engineering profile</a>
    </nav>
  </main>
</body>
</html>
